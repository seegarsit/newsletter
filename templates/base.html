<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>The Fence Line — {{ n.month }} {{ n.year }} | Seegars Fence Company</title>
    <meta name="description" content="The Fence Line — Monthly newsletter of Seegars Fence Company. Vol. {{ n.volume }}, No. {{ n.issue }}, {{ n.month }} {{ n.year }}.">
    {# Early-paint theme bootstrap — set data-theme BEFORE CSS loads to avoid flash #}
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('fenceLineTheme');
                if (stored !== 'light' && stored !== 'dark') {
                    stored = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', stored);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=UnifrakturMaguntia&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Oswald:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/newspaper.css') }}">
</head>
<body>
    <div class="newspaper">
        {% block content %}{% endblock %}
    </div>

    {# Lightbox — outside .newspaper so it covers everything #}
    <div class="lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Enlarged image">
        <button class="lightbox-close" aria-label="Close">&times;</button>
        <button class="lightbox-prev" aria-label="Previous image">&#10094;</button>
        <img class="lightbox-img" src="" alt="">
        <button class="lightbox-next" aria-label="Next image">&#10095;</button>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
