{% extends 'admin/base.html' %}
{% set title = 'Admin Login' %}

{% block content %}
<section class="card">
  <h2>Admin Login</h2>
  <form method="post" class="stack">
    <label class="field">
      <span>Email</span>
      <input type="email" name="email" required />
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" required />
    </label>
    <button class="button" type="submit">Sign in</button>
  </form>
  <p class="help-text">
    Use the credentials defined in <code>ADMIN_EMAIL</code> and <code>ADMIN_PASSWORD</code> for the first login.
  </p>
</section>
{% endblock %}
